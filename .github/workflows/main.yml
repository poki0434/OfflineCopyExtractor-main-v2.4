name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 自动定位 Android 项目目录
        id: locate
        run: |
          SETTINGS_FILE=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "未找到 settings.gradle.kts，当前仓库文件列表："
            find . -maxdepth 4
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "定位到 Android 项目目录: $PROJECT_DIR"

      - name: 3. 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 配置 Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: 5. 下载并校验 sherpa-onnx Android AAR 依赖
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          mkdir -p "$PROJECT_DIR/app/libs"
          python3 - <<PY
          import json, urllib.request, subprocess, sys
          req = urllib.request.Request(
              "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases?per_page=15",
              headers={"User-Agent": "GitHubActions"}
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              releases = json.loads(resp.read().decode())
          aar_url = None
          for rel in releases:
              for asset in rel.get("assets", []):
                  name = asset.get("name", "")
                  if name.endswith(".aar") and "sherpa-onnx" in name:
                      aar_url = asset["browser_download_url"]
                      print("Found AAR:", name, "->", aar_url)
                      break
              if aar_url:
                  break
          if not aar_url:
              print("ERROR: No .aar asset found in recent releases")
              sys.exit(1)
          out = "$PROJECT_DIR/app/libs/sherpa-onnx.aar"
          subprocess.run(["curl", "-fL", "-o", out, aar_url], check=True)
          subprocess.run(["unzip", "-tq", out], check=True)
          PY

      - name: 6. 下载并精简 SenseVoice 离线语音模型
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          mkdir -p "$PROJECT_DIR/app/src/main/assets/sensevoice"
          curl -fL -o sensevoice.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar -xjf sensevoice.tar.bz2
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx "$PROJECT_DIR/app/src/main/assets/sensevoice/"
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt "$PROJECT_DIR/app/src/main/assets/sensevoice/"
          rm -rf sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17 sensevoice.tar.bz2

      - name: 7. 编译签名版 Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleRelease --no-daemon

      - name: 8. 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCopyExtractor-v2.4-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
